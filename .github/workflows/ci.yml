name: TypeScript checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Explicit live gate must fail without opt-in (no network)
        shell: bash
        run: |
          if env -u LIVE_AZURE_TEST node dist/cli.js --live >live-gate.log 2>&1; then
            echo 'Live gate silently accepted a missing opt-in'
            exit 1
          fi
          grep -q 'live_gate_requires_LIVE_AZURE_TEST_true_no_network' live-gate.log
